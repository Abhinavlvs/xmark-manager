# Safari: build the app that wraps the released Safari bundle and upload it to App Store Connect.
# Manual only, dry run by default.
#
# Three jobs. `verify` (ubuntu) and `unsigned-build` (macOS) have NO environment and NO secrets:
# `verify` fetches the release files and proves where they came from (attestation, or a
# reproducible rebuild when attestations are switched off; the rebuild runs on ubuntu, UNCONFIRMED
# that it matches across operating systems and CPU architectures), and `unsigned-build` tries an
# UNSIGNED build. `deploy` needs `verify`, runs only with dry_run unticked, and is the only job with
# the environment `app-store-connect` (required reviewers; secrets APPLE_CERTIFICATE_P12_BASE64,
# APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64, APP_STORE_CONNECT_API_KEY_ID,
# APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_PRIVATE_KEY). It never runs code from a
# release tag. All jobs run from main only (the environment must also be restricted to main, see
# docs/RELEASING.md).
#
# STATUS: scaffold. scripts/safari/*.mjs and the Xcode project come from the Safari task (C3) and do
# not exist on this branch, so the signed upload is gated off with a clear TODO. Every Apple command
# below is UNCONFIRMED against current Apple documentation (the Apple pages could not be read when
# this file was written); check them on a real Mac before the first run.
name: Deploy to Safari (App Store Connect)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: verify the files, build unsigned, upload nothing'
        type: boolean
        default: true
      source:
        description: 'Where to take the release files from'
        type: choice
        options: [release, run]
        default: release
      release_tag:
        description: 'Tag of the GitHub Release (source = release), for example v1.2.3'
        type: string
        default: ''
      run_id:
        description: 'Release workflow run id (source = run)'
        type: string
        default: ''
      verify:
        description: 'How the files are proven: attestation, or rebuild (only when the variable ATTESTATIONS is off)'
        type: choice
        options: [attestation, rebuild]
        default: attestation

permissions:
  contents: read

concurrency:
  group: deploy-safari
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      hashes: ${{ steps.release.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Fetch and verify the release files
        id: release
        uses: ./.github/actions/fetch-release
        with:
          source: ${{ inputs.source }}
          release_tag: ${{ inputs.release_tag }}
          run_id: ${{ inputs.run_id }}
          verify: ${{ inputs.verify }}
          attestations_off: ${{ vars.ATTESTATIONS }}
          rebuild_here: 'true'
          token: ${{ github.token }}

  unsigned-build:
    name: Unsigned build (no secrets)
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Fetch and verify the release files
        id: release
        uses: ./.github/actions/fetch-release
        with:
          source: ${{ inputs.source }}
          release_tag: ${{ inputs.release_tag }}
          run_id: ${{ inputs.run_id }}
          verify: ${{ inputs.verify }}
          attestations_off: ${{ vars.ATTESTATIONS }}
          expected_hashes: ${{ needs.verify.outputs.hashes }}
          token: ${{ github.token }}
      - name: Unpack the bundle and try an unsigned build
        env:
          DIR: ${{ steps.release.outputs.directory }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! ls scripts/safari/*.mjs >/dev/null 2>&1; then
            echo "::notice::TODO: scripts/safari/*.mjs not present (delivered by the Safari task C3)"
          fi
          work="$RUNNER_TEMP/safari-dry"
          rm -rf "$work"
          mkdir -p "$work/bundle"
          unzip -q "$DIR/xmark-manager-${VERSION}-safari.zip" -d "$work/bundle"
          # UNCONFIRMED flags: check `xcrun safari-web-extension-converter --help` on the runner.
          xcrun safari-web-extension-converter "$work/bundle" --project-location "$work/project" \
            --no-open --no-prompt
          project="$(find "$work/project" -maxdepth 3 -name '*.xcodeproj' | head -n 1)"
          test -n "$project" || { echo "::error::converter produced no Xcode project"; exit 1; }
          xcodebuild -project "$project" -alltargets CODE_SIGNING_ALLOWED=NO build
          echo "unsigned build finished; dry run stops here (nothing was signed or uploaded)"

  deploy:
    name: Safari build and upload
    needs: verify
    if: ${{ inputs.dry_run == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: app-store-connect
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      KEYCHAIN_NAME: xmark-build.keychain-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Verified again here: the files are never trusted across jobs, only their hashes are compared.
      - name: Fetch and verify the release files
        id: release
        uses: ./.github/actions/fetch-release
        with:
          source: ${{ inputs.source }}
          release_tag: ${{ inputs.release_tag }}
          run_id: ${{ inputs.run_id }}
          verify: ${{ inputs.verify }}
          attestations_off: ${{ vars.ATTESTATIONS }}
          expected_hashes: ${{ needs.verify.outputs.hashes }}
          token: ${{ github.token }}
      - name: Preflight (a real run needs the Safari build scripts)
        id: preflight
        run: |
          set -euo pipefail
          if ls scripts/safari/*.mjs >/dev/null 2>&1; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
            echo "::error::signed Safari upload is not wired yet (TODO: scripts/safari/*.mjs from task C3); run with dry_run = true"
            exit 1
          fi
      - name: Import signing material into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/$KEYCHAIN_NAME"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # `security import` takes the p12 passphrase only as an argument (-P); it has no stdin or
          # file option (UNCONFIRMED: man security). On a runner an argument is visible to every
          # process on the machine through ps, so this is acceptable ONLY on a single-use GitHub
          # hosted VM (never use this step on a self-hosted runner). The value is a masked secret.
          # Access is limited to codesign and security (-T) instead of every application (-A).
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" | plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.provisionprofile" "$profile_dir/$uuid.provisionprofile"
          printf '%s' "$profile_dir/$uuid.provisionprofile" > "$RUNNER_TEMP/installed-profile-path"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.provisionprofile"
      - name: Archive, sign and upload to App Store Connect
        if: steps.preflight.outputs.scripts == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$key_path"
          # TODO(C3): the Safari task defines how scripts/safari/*.mjs produce the Xcode project and
          # ExportOptions.plist (method app-store-connect, destination upload). Then run, UNCONFIRMED:
          #   xcodebuild -exportArchive -archivePath <app.xcarchive> -exportOptionsPlist <plist> \
          #     -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$key_path" \
          #     -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"
          rm -f "$key_path"
          echo "::error::TODO(C3): archive and upload commands are not wired yet"
          exit 1
      - name: Delete the temporary keychain, profile and key material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/installed-profile-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/installed-profile-path")"
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12" \
            "$RUNNER_TEMP/profile.provisionprofile" "$RUNNER_TEMP/installed-profile-path"
