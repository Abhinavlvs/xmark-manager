<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xmark-manager icons</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 20px;
      }
      .black {
        background: #000;
        color: #fff;
      }
      .white {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="row black">
      <img src="/icons/icon-light.svg" width="128" height="128" alt="" />
      <img src="/icons/icon-light.svg" width="64" height="64" alt="" />
      <img src="/icons/icon-light.svg" width="32" height="32" alt="" />
      <img src="/icons/icon-light.svg" width="16" height="16" alt="" />
    </div>
    <div class="row white">
      <img src="/icons/icon-dark.svg" width="128" height="128" alt="" />
      <img src="/icons/icon-dark.svg" width="64" height="64" alt="" />
      <img src="/icons/icon-dark.svg" width="32" height="32" alt="" />
      <img src="/icons/icon-dark.svg" width="16" height="16" alt="" />
    </div>
  </body>
</html>
